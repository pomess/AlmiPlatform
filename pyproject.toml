[project]
name = "disease360-atlas"
version = "0.2.0"
description = "Disease360 Atlas — Almirall competitive-intelligence cockpit. Databricks App + Unity Catalog."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Bruno" }]

dependencies = [
    # HTTP / web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    # Databricks
    "databricks-sql-connector>=3.0",
    "databricks-sdk>=0.30",
    # Storage / parsing
    "pydantic>=2.8",
    "python-frontmatter>=1.1",
    "feedparser>=6.0",
    # LangChain (for Vera proxy + research pipeline)
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langgraph>=0.6,<2.0",
    "langchain-google-genai>=2.1.0",
    # Google GenAI SDK (grounding in deep research)
    "google-genai>=1.0",
    # DuckDuckGo search fallback
    "ddgs>=9.0",
    # Misc
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "tzdata>=2024.2",
    # BioMCP data pipeline
    "biomcp-python==0.7.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
atlas-memory = "atlas_memory.main:run"
atlas-harness = "atlas_harness.api:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "services/runtime/atlas_runtime",
    "services/memory/atlas_memory",
    "services/harness/atlas_harness",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
