[project]
name = "kairos"
version = "0.1.0"
description = "Kairos — Bruno's personal AI cockpit. LangChain 1.x + Deep Agents."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Bruno" }]

dependencies = [
    # LangChain 1.0 + Deep Agents
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langgraph>=0.6,<2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "deepagents>=0.5.3",
    "langsmith>=0.3.0",
    # Models
    "langchain-google-genai>=2.1.0",
    "langchain-ollama>=0.3.0",
    # Google GenAI SDK (used directly for grounding in deep research)
    "google-genai>=1.0",
    # DuckDuckGo search fallback for when Google grounding is unavailable
    "ddgs>=9.0",
    # HTTP / web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    # Storage / parsing
    "pydantic>=2.8",
    "python-frontmatter>=1.1",
    "watchfiles>=0.24",
    "feedparser>=6.0",
    # CLI
    "typer>=0.13",
    "rich>=13.9",
    # Misc
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "tzdata>=2024.2",
    "aiosqlite>=0.22.1",
    # Postgres-canonical vault (phase 2 of ADR 0001)
    "asyncpg>=0.30",
    # BioMCP data pipeline (fetch_biomcp.py) — pinned to final Python release
    "biomcp-python==0.7.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
kairos = "kairos_cli.main:app"
kairos-memory = "kairos_memory.main:run"
kairos-harness = "kairos_harness.api:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "services/runtime/kairos_runtime",
    "services/memory/kairos_memory",
    "services/harness/kairos_harness",
    "services/channels/cli/kairos_cli",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
