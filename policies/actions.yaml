# Action policy — read-only cockpit
#
# The cockpit reads the vault and external sources. There is no
# approval queue: any tool not on the allow-list is simply not exposed
# to the agent. Genuinely destructive operations stay on `never` as a
# tripwire in case future code accidentally registers them.

default: deny

allow_silently:
  # memory / wiki (HTTP to services/memory)
  - list_brains
  - search_wiki
  - get_page
  - get_hot
  - get_index
  - get_graph
  # filesystem (read-only, scoped)
  - read_file       # within configured allowlisted roots
  - list_dir
  # network (read-only, allowlisted hosts)
  - http_get
  # research pipeline (read-only)
  - deep_research

never:
  - rm_rf
  - format_disk
  - curl_pipe_bash
  - move_money
  - delete_brain
  - send_email
  - send_message
  - shell_command
  - file_write
  - http_post
  - install_skill
  - ingest_text
  - apply_ingest
  - apply_solve
  - write_note
  - replace_hot
  - append_hot
  - update_hot_cache.append
  - update_hot_cache.delete_section
  - update_hot_cache.replace_section
  - create_calendar_event
  - update_calendar_event
  - delete_calendar_event
