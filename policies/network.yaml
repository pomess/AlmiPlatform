# Network policy
# Allowlist of outbound hosts. Anything not listed → blocked at the proxy/firewall layer.

allow:
  # LLM providers
  - generativelanguage.googleapis.com   # Gemini
  - api.anthropic.com                   # Claude (optional)
  - api.openai.com                      # OpenAI (optional)
  - localhost                           # Ollama on 127.0.0.1:11434
  - 127.0.0.1

  # Google Workspace
  - www.googleapis.com
  - oauth2.googleapis.com
  - accounts.google.com

  # Web search (pick one in Phase 2)
  - api.tavily.com
  - api.search.brave.com
  - duckduckgo.com

  # Package managers (dev only — gate at install time)
  - registry.npmjs.org
  - pypi.org
  - files.pythonhosted.org
  - github.com
  - raw.githubusercontent.com

deny: []   # everything not in `allow` is denied implicitly
