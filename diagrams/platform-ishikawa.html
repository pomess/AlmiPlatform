const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");

const SVG_THEME_VARS = [
  "--ink", "--secondary", "--muted", "--spine", "--accent", "--accent-deep",

function syncSvgThemeVars() {
  const styles = getComputedStyle(document.body);
  SVG_THEME_VARS.forEach(name => {
    svg.style.setProperty(name, styles.getPropertyValue(name).trim());
  });
}

function applyTheme(theme) {
  document.body.dataset.theme = theme;
  syncSvgThemeVars();
  themeToggle.textContent = theme === "dark" ? "Light theme" : "Dark theme";
  themeToggle.setAttribute("aria-pressed", String(theme === "dark"));
  localStorage.setItem("platform-ishikawa-theme", theme);
}

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function wrap(text, max) {
  const words = text.split(" ");
  const lines = [];
  let cur = "";
  for (const w of words) {
    if ((cur + " " + w).trim().length > max && cur) { lines.push(cur); cur = w; }
    else cur = (cur + " " + w).trim();
  }
  if (cur) lines.push(cur);
  return lines;
}

// background — light surface + mint aurora + faint navy grid (mirrors landing .hero)
const INK = "var(--ink)";
const MUTED = "var(--muted)";
const SPINE = "var(--spine)";
const defs = el("defs", {}, svg);
const bg = el("radialGradient", { id: "diagramBg", cx: "50%", cy: "40%", r: "75%" }, defs);
el("stop", { offset: "0%", "stop-color": "var(--diagram-bg-a)" }, bg);
el("stop", { offset: "100%", "stop-color": "var(--diagram-bg-b)" }, bg);
const aurora = el("radialGradient", { id: "diagramAurora", cx: "50%", cy: "50%", r: "50%" }, defs);
el("stop", { offset: "0%", "stop-color": "var(--diagram-aurora)" }, aurora);
el("stop", { offset: "70%", "stop-color": "var(--diagram-aurora-zero)" }, aurora);
const grid = el("pattern", { id: "navyGrid", width: 64, height: 64, patternUnits: "userSpaceOnUse" }, defs);
el("path", { d: "M 64 0 L 0 0 0 64", fill: "none", stroke: "var(--diagram-grid)", "stroke-width": 1 }, grid);
el("rect", { x: -W, y: -H, width: W * 3, height: H * 3, fill: "url(#diagramBg)" }, svg);
el("rect", { x: -W, y: -H, width: W * 3, height: H * 3, fill: "url(#navyGrid)" }, svg);
el("ellipse", { cx: W * 0.5, cy: H * 0.42, rx: W * 0.42, ry: H * 0.5, fill: "url(#diagramAurora)" }, svg);

// spine
el("line", { x1: spineLeft, y1: cy, x2: headX, y2: cy,
  stroke: SPINE, "stroke-width": 5, "stroke-linecap": "round" }, svg);
// arrow into head
const arrow = el("polygon", { points: `${headX},${cy-12} ${headX+26},${cy} ${headX},${cy+12}`,
  fill: SPINE }, svg);

// head box
const hg = el("g", {}, svg);
const headLines = HEAD.split("\n");
const hbw = 300, hbh = 96;
el("rect", { x: headX + 30, y: cy - hbh/2, width: hbw, height: hbh, rx: 14,
  fill: "var(--head-bg)", stroke: "var(--head-border)", "stroke-width": 2.5 }, hg);
headLines.forEach((ln, i) => {
  el("text", { x: headX + 30 + hbw/2, y: cy - 6 + i*26, "text-anchor": "middle",
    fill: i === 0 ? INK : "var(--head-subtext)", "font-size": i === 0 ? 20 : 14, "font-weight": i === 0 ? 700 : 560 }, hg)
    .textContent = ln;
});

// distribute bones along the spine, alternating top/bottom
const n = BONES.length;
BONES.forEach((bone, i) => {
  const top = i % 2 === 0;
  // attach point along spine (leftmost bones first, head on the right)
  const ax = spineLeft + (spineSpan * (i + 1)) / (n + 1);
  const ay = cy;
  const tipX = ax - boneDX;
  const tipY = top ? cy - boneDY : cy + boneDY;

  const c = COLORS[bone.status];
  const g = el("g", { "data-bone": i }, svg);
  if (bone.categories) g.setAttribute("style", "cursor:zoom-in");

  // bone line
  el("line", { x1: ax, y1: ay, x2: tipX, y2: tipY,
    stroke: c.line, "stroke-width": 3.5, "stroke-linecap": "round" }, g);

  // category/label chip at the tip
  const labelLines = wrap(bone.title, 22);
  const chipW = 250, chipH = 22 + labelLines.length * 17;
  const chipX = tipX - chipW/2;
  const chipY = top ? tipY - chipH - 4 : tipY + 4;
  el("rect", { x: chipX, y: chipY, width: chipW, height: chipH, rx: 10,
    fill: c.chip, stroke: c.line, "stroke-width": 2 }, g);
  const labelCenterY = chipY + chipH / 2;
  labelLines.forEach((ln, k) => {
    el("text", { x: tipX, y: labelCenterY - (labelLines.length - 1) * 8.5 + k * 17,
      "text-anchor": "middle", "dominant-baseline": "central",
      fill: c.text, "font-size": 14.5, "font-weight": 760 }, g).textContent = ln;
  });
  if (bone.note) {
    el("text", { x: tipX, y: chipY + chipH + 14, "text-anchor": "middle",
      fill: c.text, "font-size": 11, "font-style": "italic" }, g).textContent = "(" + bone.note + ")";
  }

  // sub-items laid along the bone, fanning toward the spine
  const m = bone.items.length;
  bone.items.forEach((it, k) => {
    const tt = (k + 1) / (m + 1);
    const px = ax + (tipX - ax) * tt;
    const py = ay + (tipY - ay) * tt;
    const ic = COLORS[it.s];
    // small connector tick to the right (toward spine side)
    el("circle", { cx: px, cy: py, r: 4, fill: ic.line, style: `color:${ic.line}` }, g);
    const lines = wrap(it.t, 30);
    const lh = 13.5;
    const baseY = py - ((lines.length - 1) * lh) / 2 + 4;
    lines.forEach((ln, li) => {
      el("text", { x: px + 12, y: baseY + li*lh, "text-anchor": "start",
        fill: ic.text, "font-size": 13, "font-weight": 520 }, g).textContent = ln;
    });
  });

  // clickable hitbox over the whole bone for expand (MVP opens nested detail)
  const hit = el("rect", {
    x: Math.min(ax, tipX) - 140, y: Math.min(ay, tipY) - 10,
    width: Math.abs(ax - tipX) + 200, height: Math.abs(ay - tipY) + chipH + 30,
    fill: "transparent", class: "bone-hit",
  }, g);
  if (bone.categories) {
    hit.style.cursor = "zoom-in";
    g.addEventListener("click", () => openModal(bone));
  }
});

// caption — bottom-left corner, clear of the first bone's labels
el("text", { x: 40, y: H - 26, fill: MUTED, "font-size": 16, "font-weight": 600 }, svg)
  .textContent = "Effect (head):  a per-client AI workspace.  Bones = the platform's pieces.";

/* ------------------------------------------------------------------ *
 *  MODAL — nested MVP fishbone detail
 * ------------------------------------------------------------------ */
function openModal(bone) {
  document.getElementById("modal-title").textContent = bone.title;
  document.getElementById("modal-sub").textContent =
    "Nested detail view for this platform component.";
  const wrapEl = document.getElementById("modal-cats");
  wrapEl.innerHTML = "";
  bone.categories.forEach(cat => {
    const card = document.createElement("div");
    card.className = "cat";
    const h = document.createElement("h3");
    h.textContent = cat.name;
    card.appendChild(h);
    const ul = document.createElement("ul");
    cat.items.forEach(it => {
      const li = document.createElement("li");
      li.textContent = it;
      ul.appendChild(li);
    });
    card.appendChild(ul);
    wrapEl.appendChild(card);
  });
  document.getElementById("modal").classList.add("open");
}
document.getElementById("modal-close").addEventListener("click",
  () => document.getElementById("modal").classList.remove("open"));
document.getElementById("modal").addEventListener("click", e => {
  if (e.target.id === "modal") e.target.classList.remove("open");
});

/* ------------------------------------------------------------------ *
 *  PAN / ZOOM
 * ------------------------------------------------------------------ */
const view = { x: 0, y: 0, w: W, h: H };
function applyView() { svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`); }
function resetView() { view.x = 0; view.y = 0; view.w = W; view.h = H; applyView(); }
applyView();

svg.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = view.x + (e.clientX - rect.left) / rect.width * view.w;
  const my = view.y + (e.clientY - rect.top) / rect.height * view.h;
  const factor = e.deltaY > 0 ? 1.12 : 0.89;
  const nw = Math.min(W * 2.5, Math.max(W * 0.18, view.w * factor));
  const nh = nw * (H / W);
  view.x = mx - (mx - view.x) * (nw / view.w);
  view.y = my - (my - view.y) * (nh / view.h);
  view.w = nw; view.h = nh;
  applyView();
}, { passive: false });

let drag = null;
svg.addEventListener("pointerdown", e => {
  drag = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
  svg.classList.add("dragging"); svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!drag) return;
  const rect = svg.getBoundingClientRect();
  view.x = drag.vx - (e.clientX - drag.sx) / rect.width * view.w;
  view.y = drag.vy - (e.clientY - drag.sy) / rect.height * view.h;
  applyView();
});
function endDrag() { drag = null; svg.classList.remove("dragging"); }
svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointerleave", endDrag);

document.getElementById("reset").addEventListener("click", resetView);
themeToggle.addEventListener("click", () => {
  applyTheme(document.body.dataset.theme === "dark" ? "light" : "dark");
});

/* ------------------------------------------------------------------ *
 *  EXPORT — rasterize the full SVG to a high-res PNG
 * ------------------------------------------------------------------ */
function exportPNG(scale = 3) {
  const clone = svg.cloneNode(true);
  clone.setAttribute("viewBox", `0 0 ${W} ${H}`);
  clone.setAttribute("width", W);
  clone.setAttribute("height", H);
  const xml = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = W * scale;
    canvas.height = H * scale;
    const ctx = canvas.getContext("2d");
    const themeStyles = getComputedStyle(document.body);
    ctx.fillStyle = themeStyles.getPropertyValue("--export-bg").trim() || "#fbfcfe";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob(blob => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "disease360-platform-ishikawa.png";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, "image/png");
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert("Export failed — try a different browser."); };
  img.src = url;
}
document.getElementById("export").addEventListener("click", () => exportPNG(3));
</script>
</body>
